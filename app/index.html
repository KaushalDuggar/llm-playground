<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Playground</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --text: #1c1c1a;
    --muted: #6b6b66;
    --border: #e3e2de;
    --accent: #2f6fdb;
    --accent-text: #ffffff;
    --user-bubble: #e8effc;
    --ok: #2e9d5b;
    --warn: #c98a14;
    --off: #b5b4ae;
    --error-bg: #fdecec;
    --error-text: #a12626;
    --bar: #e9e8e4;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --panel: #1f1f1d;
      --text: #ecebe7;
      --muted: #9a9993;
      --border: #33332f;
      --accent: #6a9cf0;
      --accent-text: #0e1420;
      --user-bubble: #22304a;
      --ok: #4cc27f;
      --warn: #e0a83a;
      --off: #5a5954;
      --error-bg: #3a1f1f;
      --error-text: #f2a3a3;
      --bar: #2c2c29;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid;
    grid-template-columns: 310px 1fr;
  }

  /* Sidebar */
  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
  }
  h1 { font-size: 17px; margin: 0; }
  .label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .tier { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .badge.premium { border-color: var(--warn); color: var(--warn); }
  .models { display: flex; flex-direction: column; gap: 4px; }
  .model {
    display: grid;
    grid-template-columns: 10px 1fr;
    column-gap: 10px;
    align-items: center;
    text-align: left;
    padding: 7px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .model:hover { background: var(--bg); }
  .model.active { border-color: var(--accent); background: var(--bg); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.partial { background: var(--warn); }
  .dot.down { background: var(--off); }
  .model small { grid-column: 2; font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .usage-row { font-size: 13px; margin-bottom: 8px; }
  .usage-row .nums { display: flex; justify-content: space-between; color: var(--muted); }
  .bar { height: 6px; background: var(--bar); border-radius: 3px; overflow: hidden; margin-top: 3px; }
  .bar > div { height: 100%; background: var(--accent); }
  .bar > div.full { background: var(--error-text); }
  .resets { font-size: 12px; color: var(--muted); }
  details summary { cursor: pointer; }
  .policy { display: grid; gap: 10px; margin-top: 10px; }
  .policy label { display: grid; grid-template-columns: 1fr 96px; align-items: center; gap: 8px; font-size: 13px; }
  .policy label small { display: block; color: var(--muted); font-size: 11px; }
  .policy .msg { font-size: 12px; color: var(--error-text); min-height: 1em; }
  input, textarea {
    width: 100%;
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
  }
  input { font-family: var(--mono); font-size: 13px; }
  select {
    width: 100%;
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  aside textarea { resize: vertical; min-height: 60px; font-size: 13px; }
  button.secondary {
    width: 100%;
    padding: 8px;
    font: inherit;
    font-size: 14px;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  button.link {
    background: none; border: none; padding: 0;
    color: var(--accent); font: inherit; font-size: 12px; cursor: pointer;
  }

  /* Chat */
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    color: var(--muted);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .empty { margin: auto; color: var(--muted); text-align: center; max-width: 420px; }
  .msg { max-width: 760px; width: 100%; margin: 0 auto; }
  .msg .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user .body {
    background: var(--user-bubble);
    padding: 10px 14px;
    border-radius: 12px;
    margin-left: auto;
    width: fit-content;
    max-width: 85%;
  }
  .msg.error .body {
    background: var(--error-bg);
    color: var(--error-text);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
  }
  .msg.error .reason { font-weight: 600; display: block; margin-bottom: 2px; }
  .meta, .trace {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  .trace div { display: grid; grid-template-columns: 16px 1fr auto; gap: 6px; overflow-wrap: anywhere; }
  .trace .ok { color: var(--ok); }
  .trace .fail { color: var(--error-text); }
  .pending .body { color: var(--muted); }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    max-width: 808px;
    width: 100%;
    margin: 0 auto;
  }
  form textarea { resize: none; height: 46px; max-height: 200px; padding: 8px 10px; }
  form button {
    padding: 0 18px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: not-allowed; }

  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 50vh; }
    main { height: auto; min-height: 0; }
    header, #messages, form { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<aside>
  <div>
    <h1>LLM Playground</h1>
  </div>

  <div>
    <div class="label"><label for="user">Acting as</label></div>
    <select id="user"></select>
    <div class="tier" id="tier"></div>
  </div>

  <div>
    <div class="label">Model</div>
    <div class="models" id="models"></div>
  </div>

  <div>
    <div class="label">Today's budget</div>
    <div id="usage"></div>
  </div>

  <details id="policy-box">
    <summary class="label" style="display:list-item">Policy</summary>
    <div class="policy" id="policy"></div>
  </details>

  <div>
    <div class="label"><label for="system">System prompt</label></div>
    <textarea id="system" placeholder="Optional"></textarea>
  </div>

  <button class="secondary" id="new-chat" type="button">New chat</button>
</aside>

<main>
  <header id="current">Loading…</header>
  <div id="messages"></div>
  <form id="composer">
    <textarea id="input" placeholder="Message (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  const POLICY_LABELS = {
    retries: ["Retries", "extra tries on the same route"],
    timeout_s: ["Timeout (s)", "longest wait for one attempt"],
    deadline_s: ["Deadline (s)", "longest the whole request may take"],
    daily_calls: ["Calls per day", "every attempt counts"],
    daily_tokens: ["Tokens per day", "input + output"],
    max_prompt_tokens: ["Max prompt tokens", "biggest conversation per request"],
  };
  const REASONS = {
    not_allowed: "Not on your tier",
    prompt_too_long: "Conversation too long",
    budget: "Daily budget used up",
    bad_request: "Bad request",
    deadline: "Deadline reached",
    all_routes_failed: "All routes failed",
  };

  let info = null;              // /api/users/{id}: tier, models, policy, usage
  let model = null;             // selected named model
  // Each entry: {role, content} plus meta/trace on replies; errors are shown but never sent.
  let messages = [];
  let busy = false;

  const num = (n) => n.toLocaleString();

  async function loadUsers() {
    const users = await (await fetch("/api/users")).json();
    const select = $("user");
    for (const u of users) select.add(new Option(`${u.name} · ${u.tier}`, u.id));
    const saved = store.get("user");
    if (users.some(u => u.id === saved)) select.value = saved;
    await loadUser();
  }

  async function loadUser() {
    const id = $("user").value;
    store.set("user", id);
    info = await (await fetch(`/api/users/${id}`)).json();
    const saved = store.get(`model:${id}`);
    model = info.models.find(m => m.name === (model || saved)) ? (model || saved) : info.models[0].name;
    render();
  }

  function render() {
    const t = info.tier;
    $("tier").innerHTML = "";
    const badge = document.createElement("span");
    badge.className = "badge" + (t.name === "premium" ? " premium" : "");
    badge.textContent = t.label;
    $("tier").append(badge, ` · fallback ${t.fallback ? "on" : "off"}`);
    renderModels();
    renderUsage();
    renderPolicy();
    renderHeader();
  }

  function renderModels() {
    const list = $("models");
    list.innerHTML = "";
    for (const m of info.models) {
      const down = m.routes.filter(r => r.unavailable);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "model" + (m.name === model ? " active" : "");
      btn.innerHTML = '<span class="dot"></span><span></span><small></small>';
      btn.children[0].className = "dot" + (down.length === m.routes.length ? " down" : down.length ? " partial" : "");
      btn.children[1].textContent = m.label;
      btn.children[2].textContent = m.routes.map(r => r.provider).join(" → ");
      btn.title = m.routes.map(r => `${r.provider}: ${r.model}  (${num(r.context_window)} ctx)` +
        (r.unavailable ? `\n  ✗ ${r.unavailable}` : "")).join("\n");
      btn.onclick = () => { model = m.name; store.set(`model:${info.user.id}`, model); renderModels(); renderHeader(); };
      list.appendChild(btn);
    }
  }

  function renderUsage() {
    const u = info.usage, p = info.policy;
    const row = (label, used, limit) => {
      const pct = Math.min(100, (used / limit) * 100);
      return `<div class="usage-row"><div class="nums"><span>${label}</span><span>${num(used)} / ${num(limit)}</span></div>
        <div class="bar"><div class="${pct >= 100 ? "full" : ""}" style="width:${pct}%"></div></div></div>`;
    };
    $("usage").innerHTML = row("Calls", u.calls, p.daily_calls.value) +
      row("Tokens", u.tokens, p.daily_tokens.value) +
      `<div class="resets">Resets ${u.resets_at}</div>`;
  }

  function renderPolicy() {
    const box = $("policy");
    box.innerHTML = "";
    for (const [field, f] of Object.entries(info.policy)) {
      const [label, hint] = POLICY_LABELS[field];
      const row = document.createElement("label");
      row.innerHTML = `<span>${label}<small>${hint} · default ${num(f.default)}, max ${num(f.max)}</small></span>`;
      const input = document.createElement("input");
      input.type = "number";
      input.min = f.min;
      input.max = f.max;
      input.value = f.value;
      input.onchange = () => savePolicy(field, input.value === "" ? null : Number(input.value));
      row.appendChild(input);
      box.appendChild(row);
    }
    const foot = document.createElement("div");
    foot.innerHTML = '<div class="msg" id="policy-msg"></div>';
    const reset = document.createElement("button");
    reset.className = "link";
    reset.type = "button";
    reset.textContent = "Reset all to tier defaults";
    reset.onclick = async () => { for (const f of Object.keys(info.policy)) await savePolicy(f, null); };
    foot.appendChild(reset);
    box.appendChild(foot);
  }

  async function savePolicy(field, value) {
    const res = await fetch(`/api/users/${info.user.id}/policy`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ field, value }),
    });
    const data = await res.json();
    if (!res.ok) { $("policy-msg").textContent = data.detail; return; }
    info = data;
    render();
    $("policy-box").open = true;
  }

  function renderHeader() {
    const m = info.models.find(m => m.name === model);
    $("current").textContent = `${info.user.name} (${info.tier.label}) · ${m ? m.label : "no model"}`;
    $("send").disabled = busy || !m;
  }

  function traceEl(attempts) {
    const el = document.createElement("div");
    el.className = "trace";
    for (const a of attempts) {
      const row = document.createElement("div");
      const mark = a.outcome === "ok" ? "✓" : a.outcome === "skipped" ? "–" : "✗";
      row.innerHTML = "<span></span><span></span><span></span>";
      row.children[0].textContent = mark;
      row.children[0].className = a.outcome === "ok" ? "ok" : a.outcome === "skipped" ? "" : "fail";
      row.children[1].textContent = `${a.provider} ${a.outcome}${a.detail ? " · " + a.detail : ""}`;
      row.children[2].textContent = a.outcome === "skipped" ? "" : `${(a.latency_ms / 1000).toFixed(1)}s`;
      el.appendChild(row);
    }
    return el;
  }

  function renderMessages() {
    const box = $("messages");
    box.innerHTML = "";
    if (!messages.length) {
      box.innerHTML = '<div class="empty">Pick a model and say something.<br>Switch users to see how the Normal and Premium tiers differ. ' +
        'Every reply shows each attempt the gateway made.</div>';
      return;
    }
    for (const m of messages) {
      const el = document.createElement("div");
      el.className = `msg ${m.role}`;
      const body = document.createElement("div");
      body.className = "body";
      if (m.reason) {
        const r = document.createElement("span");
        r.className = "reason";
        r.textContent = REASONS[m.reason] || m.reason;
        body.appendChild(r);
      }
      body.append(m.content);
      el.appendChild(body);
      if (m.meta) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = m.meta;
        el.appendChild(meta);
      }
      // A single clean success needs no trace; anything else shows every step.
      if (m.attempts && (m.attempts.length > 1 || m.attempts[0].outcome !== "ok")) {
        el.appendChild(traceEl(m.attempts));
      }
      box.appendChild(el);
    }
    box.scrollTop = box.scrollHeight;
  }

  function describe(r) {
    return [
      `${r.provider}:${r.model}`,
      `${(r.latency_ms / 1000).toFixed(1)}s`,
      `${num(r.input_tokens)} in → ${num(r.output_tokens)} out`,
    ].join("  ·  ");
  }

  async function send(text) {
    const chosen = model;
    messages.push({ role: "user", content: text });
    const history = messages
      .filter(m => m.role === "user" || m.role === "assistant")
      .map(({ role, content }) => ({ role, content }));
    const system = $("system").value.trim();
    if (system) history.unshift({ role: "system", content: system });

    messages.push({ role: "assistant pending", content: "Waiting…" });
    busy = true;
    renderHeader();
    renderMessages();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user: info.user.id, model: chosen, messages: history }),
      });
      const data = await res.json();
      messages.pop();
      if (res.ok) {
        messages.push({ role: "assistant", content: data.text, meta: describe(data), attempts: data.attempts });
      } else {
        messages.push({ role: "error", reason: data.reason, content: data.detail, attempts: data.attempts });
      }
    } catch (err) {
      messages.pop();
      messages.push({ role: "error", content: `Could not reach the server: ${err.message}` });
    }
    busy = false;
    await loadUser();   // usage and route health have changed
    renderMessages();
  }

  $("user").onchange = () => { model = null; messages = []; loadUser(); renderMessages(); };
  $("new-chat").onclick = () => { messages = []; renderMessages(); $("input").focus(); };
  $("composer").onsubmit = (e) => {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text || busy || !model) return;
    $("input").value = "";
    send(text);
  };
  $("input").onkeydown = (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      $("composer").requestSubmit();
    }
  };

  renderMessages();
  loadUsers();
</script>
</body>
</html>
