<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Playground</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --text: #1c1c1a;
    --muted: #6b6b66;
    --border: #e3e2de;
    --accent: #2f6fdb;
    --accent-text: #ffffff;
    --user-bubble: #e8effc;
    --ok: #2e9d5b;
    --off: #b5b4ae;
    --error-bg: #fdecec;
    --error-text: #a12626;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615;
      --panel: #1f1f1d;
      --text: #ecebe7;
      --muted: #9a9993;
      --border: #33332f;
      --accent: #6a9cf0;
      --accent-text: #0e1420;
      --user-bubble: #22304a;
      --ok: #4cc27f;
      --off: #5a5954;
      --error-bg: #3a1f1f;
      --error-text: #f2a3a3;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: grid;
    grid-template-columns: 290px 1fr;
  }

  /* Sidebar */
  aside {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
  }
  h1 { font-size: 17px; margin: 0; }
  .label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .providers { display: flex; flex-direction: column; gap: 4px; }
  .provider {
    display: grid;
    grid-template-columns: 10px 1fr;
    column-gap: 10px;
    align-items: center;
    text-align: left;
    padding: 8px 10px;
    border: 1px solid transparent;
    border-radius: 8px;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  .provider:hover:not(:disabled) { background: var(--bg); }
  .provider.active { border-color: var(--accent); background: var(--bg); }
  .provider:disabled { cursor: not-allowed; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
  .provider.ready .dot { background: var(--ok); }
  .provider small { grid-column: 2; font-size: 12px; color: var(--muted); }
  select, textarea {
    width: 100%;
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  select { font-family: var(--mono); font-size: 13px; }
  aside textarea { resize: vertical; min-height: 70px; font-size: 13px; }
  .buttons { display: flex; gap: 8px; margin-top: auto; }
  button.secondary {
    flex: 1;
    padding: 8px;
    font: inherit;
    font-size: 14px;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }

  /* Chat */
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .empty { margin: auto; color: var(--muted); text-align: center; }
  .msg { max-width: 760px; width: 100%; margin: 0 auto; }
  .msg .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user .body {
    background: var(--user-bubble);
    padding: 10px 14px;
    border-radius: 12px;
    margin-left: auto;
    width: fit-content;
    max-width: 85%;
  }
  .msg.error .body {
    background: var(--error-bg);
    color: var(--error-text);
    padding: 10px 14px;
    border-radius: 12px;
    font-family: var(--mono);
    font-size: 13px;
  }
  .meta {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  .pending .body { color: var(--muted); }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    max-width: 808px;
    width: 100%;
    margin: 0 auto;
  }
  form textarea { resize: none; height: 46px; max-height: 200px; }
  form button {
    padding: 0 18px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: not-allowed; }

  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 45vh; }
    main { height: auto; min-height: 0; }
    header, #messages, form { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<aside>
  <h1>LLM Playground</h1>
  <div>
    <div class="label">Provider</div>
    <div class="providers" id="providers"><span class="meta">Loading…</span></div>
  </div>
  <div>
    <div class="label"><label for="model">Model</label></div>
    <select id="model"></select>
  </div>
  <div>
    <div class="label"><label for="system">System prompt</label></div>
    <textarea id="system" placeholder="Optional"></textarea>
  </div>
  <div class="buttons">
    <button class="secondary" id="new-chat" type="button">New chat</button>
    <button class="secondary" id="refresh" type="button">Refresh</button>
  </div>
</aside>

<main>
  <header id="current">No model selected</header>
  <div id="messages"></div>
  <form id="composer">
    <textarea id="input" placeholder="Message (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  let providers = [];
  let provider = null;          // selected provider object
  // Each entry: {role, content} plus `meta` on replies; errors are shown but never sent.
  let messages = [];
  let busy = false;

  async function loadProviders() {
    $("providers").innerHTML = '<span class="meta">Loading…</span>';
    providers = await (await fetch("/api/providers")).json();
    const saved = store.get("provider");
    const initial = providers.find(p => p.name === saved && p.ready) || providers.find(p => p.ready);
    renderProviders();
    if (initial) selectProvider(initial.name, store.get("model"));
    else renderModels();
  }

  function renderProviders() {
    const list = $("providers");
    list.innerHTML = "";
    for (const p of providers) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "provider" + (p.ready ? " ready" : "") + (provider?.name === p.name ? " active" : "");
      btn.disabled = !p.ready;
      btn.innerHTML = '<span class="dot"></span><span></span><small></small>';
      btn.children[1].textContent = p.label;
      btn.children[2].textContent = p.ready ? `${p.models.length} models` : p.reason;
      btn.onclick = () => selectProvider(p.name);
      list.appendChild(btn);
    }
  }

  function selectProvider(name, preferredModel) {
    provider = providers.find(p => p.name === name);
    store.set("provider", name);
    renderProviders();
    renderModels(preferredModel);
  }

  function renderModels(preferredModel) {
    const select = $("model");
    select.innerHTML = "";
    for (const m of provider?.models || []) select.add(new Option(m, m));
    if (preferredModel && provider?.models.includes(preferredModel)) select.value = preferredModel;
    select.disabled = !provider;
    onModelChange();
  }

  function onModelChange() {
    const model = $("model").value;
    if (model) store.set("model", model);
    $("current").textContent = provider && model ? `${provider.label} · ${model}` : "No model selected";
    $("send").disabled = busy || !model;
  }

  function renderMessages() {
    const box = $("messages");
    box.innerHTML = "";
    if (!messages.length) {
      box.innerHTML = '<div class="empty">Pick a provider and model, then say something.<br>You can switch models mid-conversation.</div>';
      return;
    }
    for (const m of messages) {
      const el = document.createElement("div");
      el.className = `msg ${m.role}`;
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = m.content;
      el.appendChild(body);
      if (m.meta) {
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = m.meta;
        el.appendChild(meta);
      }
      box.appendChild(el);
    }
    box.scrollTop = box.scrollHeight;
  }

  function describe(r) {
    return [
      `${r.provider}:${r.model}`,
      `${Math.round(r.latency_ms).toLocaleString()} ms`,
      `${r.input_tokens} in → ${r.output_tokens} out`,
      `${r.tokens_per_sec.toFixed(1)} tok/s`,
    ].join("  ·  ");
  }

  async function send(text) {
    const model = $("model").value;
    messages.push({ role: "user", content: text });
    const history = messages
      .filter(m => m.role === "user" || m.role === "assistant")
      .map(({ role, content }) => ({ role, content }));
    const system = $("system").value.trim();
    if (system) history.unshift({ role: "system", content: system });

    const pending = { role: "assistant pending", content: `Waiting for ${model}…` };
    messages.push(pending);
    busy = true;
    onModelChange();
    renderMessages();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ provider: provider.name, model, messages: history }),
      });
      const data = await res.json();
      messages.pop();
      if (res.ok) messages.push({ role: "assistant", content: data.text, meta: describe(data) });
      else messages.push({ role: "error", content: data.detail, meta: `${provider.name}:${model}` });
    } catch (err) {
      messages.pop();
      messages.push({ role: "error", content: `Could not reach the server: ${err.message}` });
    }
    busy = false;
    onModelChange();
    renderMessages();
  }

  $("model").onchange = onModelChange;
  $("refresh").onclick = loadProviders;
  $("new-chat").onclick = () => { messages = []; renderMessages(); $("input").focus(); };
  $("composer").onsubmit = (e) => {
    e.preventDefault();
    const text = $("input").value.trim();
    if (!text || busy || !$("model").value) return;
    $("input").value = "";
    send(text);
  };
  $("input").onkeydown = (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      $("composer").requestSubmit();
    }
  };

  renderMessages();
  loadProviders();
</script>
</body>
</html>
