# Named models: what users pick in the UI. Changes often.
#
# Each named model is an ordered list of ROUTES, a route being one host
# serving that model (provider + the provider's own model id). Every route
# serves the SAME weights, so falling through them changes where the answer
# comes from, not how good it is. Only tiers with fallback enabled go past
# the first route.
#
# context_window is the most tokens the route accepts as input. It is per
# route because hosts can cap the same model differently.
#
# max_output_tokens (optional) caps the answer length on this route, below
# the user's policy if lower. Only set where a host's own limit makes larger
# requests fail.
#
# Only models that answered reliably on 2026-11-02 are listed. Left out, and
# why: Gemini Pro models (429, not on the free tier), gemini-3.7/3.8-flash
# (503s and 75s waits), gemini-flash-latest (97-345s replies), NVIDIA's
# deepseek/glm/minimax/gemma/gpt-oss (timeouts), kimi and nemotron-super
# (404, not on this account), OpenRouter gemma (429, shared pool).

models:

  # --- premium -------------------------------------------------------------

  nemotron-ultra:
    label: Nemotron 3 Ultra 550B
    routes:
      - provider: nvidia
        model: nvidia/nemotron-3-ultra-550b-a55b
        context_window: 131072     # NVIDIA doesn't report it; conservative
      - provider: openrouter
        model: nvidia/nemotron-3-ultra-550b-a55b:free
        context_window: 1000000

  nemotron-super-vl:
    label: Nemotron 3.5 Super VL 120B
    routes:
      - provider: nvidia
        model: nvidia/nemotron-3.5-super-vl-120b-a12b
        context_window: 131072     # NVIDIA doesn't report it; conservative
      - provider: openrouter
        model: nvidia/nemotron-3.5-super-vl:free
        context_window: 1000000

  gpt-oss-120b:
    label: GPT-OSS 120B
    routes:
      - provider: groq
        model: openai/gpt-oss-120b
        context_window: 131072

  gemini-3.6-flash:
    label: Gemini 3.6 Flash
    routes:
      - provider: google
        model: gemini-3.6-flash
        context_window: 1048576

  # --- normal --------------------------------------------------------------

  gpt-oss-20b:
    label: GPT-OSS 20B
    routes:
      - provider: groq
        model: openai/gpt-oss-20b
        context_window: 131072

  qwen-3.8-27b:
    label: Qwen 3.8 27B
    routes:
      - provider: groq
        model: qwen/qwen3.8-27b
        context_window: 131072
        # Groq's free tier allows this model 1,000 output tokens per minute
        # and reserves max_tokens up front, so asking for more is rejected
        # as "Request too large" (seen 2026-11-03).
        max_output_tokens: 1000

  gemini-3.5-flash-lite:
    label: Gemini 3.5 Flash Lite
    routes:
      - provider: google
        model: gemini-3.5-flash-lite
        context_window: 1048576

  nemotron-lightning:
    label: Nemotron 3.5 Lightning 30B
    routes:
      - provider: nvidia
        model: nvidia/nemotron-3.5-lightning-30b-a3b
        context_window: 131072     # NVIDIA doesn't report it; conservative
      - provider: openrouter
        model: nvidia/nemotron-3.5-lightning:free
        context_window: 1000000
