# Every provider the playground can call, and the free models it offers.
#
# No secrets here, only the NAME of the env var that holds each key, so this
# file is safe to commit. Export the keys (or put them in .env) and a provider
# lights up in the UI.
#
# Fields:
#   label         name shown in the UI
#   base_url      where requests go
#   key_env       env var holding the key (null: no key needed)
#   langchain     how init_chat_model addresses this provider
#     provider            model_provider passed to init_chat_model
#     base_url_override   true: pass base_url (OpenAI-compatible hosts)
#     supports_max_retries  false: the class rejects max_retries
#   models        curated free chat models, in the order the UI shows them
#   discover      list models live instead of from `models`:
#                   openrouter_free  catalog filtered to ":free" ids
#                   ollama           models installed locally

providers:

  groq:
    label: Groq
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    langchain:
      provider: groq
    # Free tier covers every model, rate-limited per organisation.
    # groq/compound and compound-mini are listed by /models but 404 on chat.
    models:
      - openai/gpt-oss-120b
      - openai/gpt-oss-20b
      - qwen/qwen3.8-27b

  nvidia:
    label: NVIDIA
    base_url: https://integrate.api.nvidia.com/v1
    key_env: NVIDIA_API_KEY
    langchain:
      provider: nvidia
      # ChatNVIDIA has no max_retries field: passing it ends up in the request
      # body and the API 400s on it.
      supports_max_retries: false
    # /models lists far more than this account can call: many ids 404 with
    # "not found for account" or 410 once they reach end of life. Checked
    # 2026-10-23; the gemma host is slow and sometimes times out.
    models:
      - nvidia/nemotron-3-ultra-550b-a55b
      - nvidia/nemotron-3.5-lightning-30b-a3b
      - openai/gpt-oss-20b
      - meta/muse-glimmer-30b
      - google/gemma-4-31b-it

  google:
    label: Google
    base_url: https://generativelanguage.googleapis.com/v1beta
    key_env: GOOGLE_API_KEY
    langchain:
      provider: google_genai
    # Metered per model, per day: one model being exhausted says nothing
    # about the others. On 2026-10-23 the two flash-lite/3.5-flash models
    # answered; the rest returned 429/500/503 at the time of checking.
    models:
      - gemini-3.5-flash
      - gemini-flash-lite-latest
      - gemini-flash-latest
      - gemini-3.1-pro-preview
      - gemma-4-31b-it

  openrouter:
    label: OpenRouter
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    langchain:
      provider: openai               # OpenAI-compatible, no dedicated package
      base_url_override: true
    # Only ":free" ids are free; the bare id of the same model is paid. The
    # free set changes often, so it is read live. Free models draw on a pool
    # shared by every OpenRouter user and 429 more than the others.
    discover: openrouter_free

  ollama:
    label: Ollama (local)
    base_url: http://localhost:11434/v1
    key_env: null
    langchain:
      provider: openai               # Ollama serves an OpenAI-compatible /v1
      base_url_override: true
    discover: ollama
